
# Name your project! Project names should contain only lowercase characters
# and underscores. A good package name should reflect your organization's
# name or the intended use of these models
name: '__project_name__'
version: '1.0.0'

# This setting configures which "profile" dbt uses for this project.
profile: '__profile_name__'

# These configurations specify where dbt should look for different types of files.
# The `model-paths` config, for example, states that models in this project can be
# found in the "models/" directory. You probably won't need to change these!
model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

clean-targets:         # directories to be removed by `dbt clean`
  - "target"
  - "dbt_packages"


vars:
  # Basket and Dataset Variables
  # These get inserted into the target schema's t_ili2db_basket table
  # when the macro 'write_basket()' is run.  
  # 
  # Note: - t_id is meant to be unique across all tables!
  #       - dataset_t_id must match one of the t_ids defined for a dataset

  # Dataset variables
  datasets:
    dataset_1:
      t_id: 1
      datasetname: dataset_1


  # Basket variables 
  baskets:
    basket_1:
      t_id: 5
      topic: topic_1
      dataset_t_id: 1 

  t_id_starting_values:
    starting_value_1: 10
    data: 100

models:
  {{ project_name }}:
    +grants:
      select: ['{{ read_role }}']
    +post-hook: 
    - 'ALTER {{model.config.materialized}} {{this}} OWNER TO "{{ write_role }}"'

