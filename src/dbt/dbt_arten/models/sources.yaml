sources:
  # schema to build transformations around
  - name: src_prod_gl_arten
    database: "{{ target.database }}"
    schema: prod_gl_arten
    tables:
      - name: artvorkommen_gl_pt
      - name: besondere_waldarten
      - name: cat_art



  # input imported into DB from geopackage  
  - name: src_dbt_arten
    database: "{{ target.database }}"
    schema: dbt_arten
    tables:
      - name: imp_wisgl_besonderearten
      - name: old_artvorkommen_gl_pt

  # output target for wisgl_export
  - name: src_gl_besonderewaldarten 
    database: "{{ target.database }}"
    schema: gl_besonderewaldarten
    tables:
      - name: besonderearten