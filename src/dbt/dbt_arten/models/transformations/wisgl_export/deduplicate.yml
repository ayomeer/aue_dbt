models:
  - name: deduplicate
    description: Entfernt redundante Objekte. Redundant heisst, dass sie die gleiche Wertekombination in den Spalten [geometrie, funddatum und id_art] aufweisen wie ein anderes Objekt mit einer höheren id. Dies kann auch nach deduplizierter Grundlagedaten in prod_gl_arten.artvorkommen_gl_pt vorkommen, da Ameisenarten teils für den Export neu zugewiesen werden. Objekte welche aus einem WISGL import stammen (`ext_wisgl_id is not NULL`), werden bei der Deduplikation mit Priorität beibehalten.
    columns:
      - name: id
        data_type: bigint
      - name: name_lateinisch
        data_type: character varying
      - name: name_deutsch
        data_type: character varying
      - name: organismengruppe
        data_type: character varying
      - name: schutz_status_schweiz
        data_type: character varying
      - name: schutz_status_kt_gl
        data_type: character varying
      - name: rote_liste_status
        data_type: character varying
      - name: radius
        data_type: numeric
      - name: genau
        data_type: boolean
      - name: foerdermassnahmen
        data_type: text
      - name: verwaltungsintern
        data_type: boolean
      - name: kantonsintern
        data_type: boolean
      - name: hinzugefuegt_am
        data_type: date
      - name: id_art
        data_type: integer
      - name: geometrie
        data_type: user-defined
      - name: bemerkungen
        data_type: text
      - name: status
        data_type: boolean
      - name: fotos
        data_type: text
      - name: finder
        data_type: character varying
      - name: funddatum
        data_type: date
      - name: substrat
        data_type: character varying
      - name: ext_herkunft
        data_type: character varying
      - name: last_modified
        data_type: date
