
# Name your project! Project names should contain only lowercase characters
# and underscores. A good package name should reflect your organization's
# name or the intended use of these models
name: 'dbt_biotope'
version: '1.0.0'

# This setting configures which "profile" dbt uses for this project.
profile: 'dbt_biotope_profile'

# These configurations specify where dbt should look for different types of files.
# The `model-paths` config, for example, states that models in this project can be
# found in the "models/" directory. You probably won't need to change these!
model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

clean-targets:         # directories to be removed by `dbt clean`
  - "target"
  - "dbt_packages"


vars:
  # Basket and Dataset Variables
  # These get inserted into the target schema's t_ili2db_basket table
  # when the macro 'write_basket()' is run.  
  # 
  # Note: - t_id is meant to be unique across all tables!
  #       - dataset_t_id must match one of the t_ids defined for a dataset

  # Dataset variables
  datasets:
    kt_auengebiete:
      biotope:
        t_id: 1
        datasetname: biotope


  # Basket variables 
  baskets:
    kt_auengebiete:
      catalogues:
        t_id: 10
        topic: kt_Auengebiete_V1_1.Codelisten
        dataset_t_id: 1 

      biotope:
        t_id: 11
        topic: kt_Auengebiete_V1_1.kt_Auengebiet
        dataset_t_id: 1




  t_id_starting_values:
    starting_value_1: 10
    data: 100

models:
  dbt_biotope:
    +grants:
      select: ['prod_gl_biotope_read']
    +post-hook: 
    - 'ALTER {{model.config.materialized}} {{this}} OWNER TO "prod_gl_biotope_write"'

seeds:
  dbt_biotope:
    +delimiter: ";"