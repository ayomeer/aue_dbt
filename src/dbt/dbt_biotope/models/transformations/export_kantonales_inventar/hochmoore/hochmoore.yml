models:
  - name: ili_mirror_kt_hochmoor_geometrie
    description: Spiegelt die Struktur der INTERLIS Zieltabelle 'ch_kt_hochmoore.kt_hochmoor' wieder.
    columns:
      - name: t_id
        data_type: bigint
      - name: t_basket
        data_type: bigint
      - name: t_ili_tid
        data_type: character varying
        data_tests:
          - not_null
      - name: geo_obj
        data_type: user-defined
      - name: kt_hochmoor_teilobjekt
        data_type: bigint
  - name: ili_mirror_kt_hochmoor_teilobjekt
    description: Spiegelt die Struktur der INTERLIS Zieltabelle 'ch_kt_hochmoore.kt_hochmoor_teilobjekt' wieder.
    columns:
      - name: t_id
        data_type: bigint
      - name: t_basket
        data_type: bigint
      - name: t_ili_tid
        data_type: character varying
        data_tests:
          - not_null
      - name: teilobj_nr
        data_type: character varying
      - name: kt_hochmoor
        data_type: bigint
  - name: ili_mirror_kt_hochmoor
    description: Spiegelt die Struktur der INTERLIS Zieltabelle 'ch_kt_hochmoore.kt_hochmoor' wieder.
    columns:
      - name: t_id
        data_type: bigint
      - name: t_basket
        data_type: bigint
      - name: t_ili_tid
        data_type: character varying
        data_tests:
          - not_null
      - name: kanton
        data_type: character varying
      - name: objnummer
        data_type: character varying
      - name: aname
        data_type: character varying
      - name: obj_gisflaeche
        data_type: numeric
      - name: herkunft
        data_type: character varying
      - name: kartierungsgrundlage
        data_type: bigint
      - name: bedeutung
        data_type: bigint
