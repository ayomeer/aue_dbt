models:
  - name: extract_and_reformat_besondere_arten_waldameisen
    description: |-
      Filtert prod_gl_arten.artvorkommen_gl_pt für Arten welche in prod_gl_arten.besondere_waldarten aufgeführt sind und zu der Organismengruppe 'Waldameisen' zählen. Folgende Neuformattierungen werden durchgeführt:
      - Für diverse Spalten: NULL-Werte durch passende defaults ersetzen (coalesce)
      - Feld "genau" erzeugen basierend auf "radius"
      - Zusammenführen intern unterschiedener Ameisengruppen
    columns:
      - name: lateinischer_name
        data_type: text
      - name: deutscher_name
        data_type: text
      - name: organismengruppe
        data_type: character varying
      - name: schutz_status_schweiz
        data_type: text
      - name: schutz_status_kt_gl
        data_type: text
      - name: rote_liste_status
        data_type: text
      - name: radius
        data_type: numeric
      - name: genau
        data_type: boolean
      - name: foerdermassnahmen
        data_type: text
      - name: verwaltungsintern
        data_type: boolean
      - name: kantonsintern
        data_type: boolean
      - name: hinzugefuegt_am
        data_type: date
      - name: id_art
        data_type: integer
      - name: geometrie
        data_type: user-defined
      - name: bemerkungen
        data_type: text
      - name: status
        data_type: boolean
      - name: fotos
        data_type: text
      - name: finder
        data_type: character varying
      - name: funddatum
        data_type: date
      - name: substrat
        data_type: character varying
      - name: ext_herkunft
        data_type: character varying
      - name: last_modified
        data_type: date
