dbu_aue_quellkataster_profile:
  target: dev
  outputs:
    dev:
      dbname: test-db
      host: localhost
      pass: "{{ env_var('DB_PASSWORD') }}" # export DB_PASSWORD='...' in bashrc
      port: 5432
      schema: dbt_quellkataster
      threads: 1
      type: postgres
      user: postgres
    prod:
      dbname: prod-db
      host: localhost
      pass: "{{ env_var('DB_PASSWORD') }}" # export DB_PASSWORD='...' in bashrc
      port: 5432
      schema: dbt_quellkataster
      threads: 1
      type: postgres
      user: postgres
  

