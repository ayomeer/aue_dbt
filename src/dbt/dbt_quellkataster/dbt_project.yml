
# Name your project! Project names should contain only lowercase characters
# and underscores. A good package name should reflect your organization's
# name or the intended use of these models
name: 'dbt_quellkataster'
version: '1.0.0'

# This setting configures which "profile" dbt uses for this project.
profile: 'prod_gl_quellkataster_profile'

# These configurations specify where dbt should look for different types of files.
# The `model-paths` config, for example, states that models in this project can be
# found in the "models/" directory. You probably won't need to change these!
model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

clean-targets:         # directories to be removed by `dbt clean`
  - "target"
  - "dbt_packages"

on-run-start: 
  - '{{ ili_utils.run_start_parsing(target_ili_schema="prod_gl_quellkataster") }}' # function defined in macros/ili_utils.sql

vars:
  target_ili_schema: prod_gl_quellkataster

  # Dataset variables
  datasets:
    dataset_access:
      t_id: 1
      datasetname: access-und-nachtraege-datenquelle
    dataset_alpquellen:
      t_id: 2
      datasetname: alpquellen-datenquelle
    dataset_neuerfassung:
      t_id: 3
      datasetname: neuerfassung

  # Basket variables 
  baskets:
    basket_quellkataster_access:
      t_id: 4
      topic: Grundwasseraustritte_intern
      dataset_t_id: 1 
    basket_quellkataster_alpquellen:
      t_id: 5
      topic: Grundwasseraustritte_intern
      dataset_t_id: 2
    basket_quellkataster_neuerfassung:
      t_id: 6
      topic: Grundwasseraustritte_intern
      dataset_t_id: 3

  # Classnames variables
  # Usage example:
  # '{{ var('classnames')['Quelle_intern'] }}'::character varying as t_type,
  classnames:
    Quelle_intern: Prod_Quellkataster_V1.Quelle.Quelle_intern
  
models:
  dbt_quellkataster: 
    +grants:
      select: ['prod_gl_quellkataster_read']
    +post-hook: 
    - 'ALTER {{model.config.materialized}} {{this}} OWNER TO "prod_gl_quellkataster_write"'


    # tags mirroring models dir structure
    initial_data_loading:
      0_info:
        +tags: 0_info
      1_staging: 
        +tags: 1_staging
      2_intermediate:
        +tags: 2_intermediate
      3_interlis_boundary:
        +tags: 3_interlis_boundary