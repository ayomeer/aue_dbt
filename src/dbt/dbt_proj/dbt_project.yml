name: 'dbt_proj'
version: '1.0.0'

profile: 'dbt_proj_profile'

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

clean-targets:         # directories to be removed by `dbt clean`
  - "target"
  - "dbt_packages"

vars:
  starting_data_tid: 100 # value t_ili2db_seq is set to (both during data creation on dbt schema as well as on target before transferring) 
  
  export_job:   
    data_basket_tid: 2


    

on-run-start:
  - ALTER SEQUENCE dbt_proj.t_ili2db_seq RESTART WITH {{ var('starting_data_tid') }}

models:
  dbt_proj:
    +grants:
      select: ['read_role']
    +post-hook: 
    - 'ALTER {{model.config.materialized}} {{this}} OWNER TO "owner_role"'
